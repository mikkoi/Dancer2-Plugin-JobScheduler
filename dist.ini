name    = Dancer2-Plugin-JobScheduler
author  = Mikko Koivunalho <mikkoi@cpan.org>
license = Perl_5
copyright_holder = Mikko Koivunalho
copyright_year   = 2026
main_module = lib/Dancer2/Plugin/JobScheduler.pm

[MetaResources]
homepage            = https://metacpan.org/release/Dancer2-Plugin-JobScheduler
bugtracker.web      = http://rt.cpan.org/NoAuth/Bugs.html?Dist=Dancer2-Plugin-JobScheduler
bugtracker.mailto   = bug-Dancer2-Plugin-JobScheduler@rt.cpan.org
repository.url      = git://github.com/mikkoi/Dancer2-Plugin-JobScheduler.git
repository.web      = https://github.com/mikkoi/Dancer2-Plugin-JobScheduler
repository.type     = git

[Keywords]
keywords = dancer dancer2 plugin

[GatherDir]
include_dotfiles = 1

[@Filter]
-bundle = @MIKKOI
-version = 0.005
-remove = GatherDir
-remove = Readme ; No need to include README file because we include the weaved README.md
-remove = PodWeaver
-remove = PerlTidy

[Prereqs / TestRecommends]
; For testing, at least one database driver for Database::Temp to use.
DBD::SQLite = 0

[Prereqs / TestRequires]
Cpanel::JSON::XS = 0

[Prereqs / RuntimeRequires]
TheSchwartz::JobScheduler = 0.002
Database::ManagedHandle = 0.003
perl = 5.014

[Software::Policies / AIDisclosure]
policy_attribute = ai_tools = Claude AI, Copilot and Gemini

[Software::Policies / License]
policy_attribute = perl_5_double_license = true

[Software::Policies / CodeOfConduct]
class = ContributorCovenant
version = 2.1

[Software::Policies / Contributing]
policy_attribute = ai_disclosure = 1
policy_attribute = ai_assisted = 1

[Software::Policies / Security]
policy_attribute = url = https://github.com/mikkoi/Dancer2-Plugin-JobScheduler/blob/main/SECURITY.md
policy_attribute = timeframe = 14 days
policy_attribute = perl_support_years = 10

[WeaveFile / README.md]
[Test::WeaveFile]

[BumpVersionAfterRelease]

; commit source files after modification
[Git::Commit / CommitAfterBumpVersionAfterRelease] ; commit Changes (for new dev)
allow_dirty_match = (^lib/|^bin/)
commit_msg = Bump version
